<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマートフォンでも適切な幅で表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/style.css">
  <title>モータースポーツ史</title>
</head>

<body>

  <!--
    モータースポーツ史 年表アプリ
    まずはGitHub Pagesで正常に表示できるか確認するための
    最小構成からスタートします。
  -->

  <h1>モータースポーツ史</h1>

  <p>
    モータースポーツの歴史をたどるデジタル年表です。
  </p>

  <p>
    Motorsports History Timeline
  </p>
  <!--
    ============================================================
    年表の表示エリア
    ============================================================

    JavaScriptが timeline.json を読み込み、
    この中に歴史データを自動的に追加していきます。

    HTML側には個々の出来事を書きません。
    出来事そのものは data/timeline.json で管理します。
  -->
  <section id="timeline">

    <h2>年表</h2>

      <!--
    ============================================================
    カテゴリーフィルター
    ============================================================

    年表の件数が増えても目的の情報を探しやすいように、
    カテゴリーによる絞り込み機能を用意します。

    現在はテストデータに合わせて、
    history / race / technology の3種類を用意しています。

    後ほどJavaScriptと接続します。
  -->
<!--
  ============================================================
  カテゴリーフィルター
  ============================================================

  カテゴリーボタンはJavaScriptが
  timeline.json の内容を見て自動生成します。

  そのため、HTML側には個別のカテゴリーを書きません。

  JSONに新しいカテゴリーを追加すれば、
  フィルターボタンも自動的に増える仕組みにします。
-->
<div id="timeline-filters">

  <!--
    JavaScriptによって、
    「すべて」と各カテゴリーボタンがここに追加されます。
  -->

</div>
    <!--
      JavaScriptによって、ここに年表が表示されます。
    -->
    <div id="timeline-list">
      <p>年表データを読み込んでいます...</p>
    </div>

  </section>
    <!--
    ============================================================
    人物
    ============================================================

    data/people.json に登録した人物情報を、
    JavaScriptがここへ表示します。

    出来事の年表とは分けて、
    人物そのものの基本情報・生没年を扱います。
  -->
  <section id="people">

    <h2>人物</h2>

    <!--
      JavaScriptによって人物カードが表示されます。
    -->
    <div id="people-list">
      <p>人物データを読み込んでいます...</p>
    </div>

  </section>

  <!-- =========================================================
     サーキット一覧
     ========================================================= -->

<section id="circuits">

  <h2>サーキット</h2>

  <!--
    app.js が circuits.json を読み込み、
    ここへサーキットカードを追加します。
  -->
  <div id="circuit-list"></div>

</section>
  
    <!--
    ============================================================
    人物ライフライン比較
    ============================================================

    複数人物の生没年を横方向の時間軸で比較します。

    たとえば、
    ・誰と誰が同時代を生きていたか
    ・どの人物が前の世代／後の世代か
    ・どの時代に人物が集中しているか

    といったことを視覚的に確認できるようにします。
  -->
  <section id="people-lifeline">

    <h2>人物ライフライン比較</h2>

    <p>
      人物ごとの生没年を、同じ時間軸上で比較します。
    </p>

    <!--
      JavaScriptによって比較表示を生成します。
    -->
    <div id="people-lifeline-chart">
      <p>人物ライフラインを読み込んでいます...</p>
    </div>

  </section>
  <!--
    年表データを読み込むJavaScript。
    bodyの最後で読み込むことで、
    HTMLの表示準備ができてからJavaScriptを実行します。
  -->
  <script src="./js/app.js"></script>  
  
</body>
</html>
